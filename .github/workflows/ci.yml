name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: setup node (actions/setup-node v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm run build
      - name: audit
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: qemu (docker/setup-qemu-action v4.4.0)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: buildx (docker/setup-buildx-action v4.4.1)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: build amd64 and arm64, no push (docker/build-push-action v7.4.0)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
      - name: build amd64 into the local daemon (docker/build-push-action v7.4.0)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: mwds-warcon-sidecar:ci
      - name: image runs as node, without npm, and refuses an empty config
        run: |
          test "$(docker image inspect -f "{{.Config.User}}" mwds-warcon-sidecar:ci)" = "node"
          ! docker run --rm --entrypoint node mwds-warcon-sidecar:ci -e "require(\"fs\").accessSync(\"/usr/local/lib/node_modules/npm\")"
          ! docker run --rm --read-only mwds-warcon-sidecar:ci

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (gitleaks/gitleaks-action v3.0.0)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
